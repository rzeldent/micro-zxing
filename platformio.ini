; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file, time, default

# Copy the Version.h shim into the submodule before building (upstream generates
# it via CMake, which PlatformIO does not run). See tools/gen_zxing_version.py
extra_scripts = pre:tools/gen_zxing_version.py

# zxing-cpp is a git submodule at lib/zxing/src (full upstream repo, pinned to a tag).
# lib/zxing is a thin PlatformIO wrapper that compiles the submodule's core/src.
# To update the library:
#   cd lib/zxing/src && git fetch --tags && git checkout <new-tag> && cd ../..
#   git add lib/zxing/src && git commit
#   then bump the version in lib/zxing/library.json and lib/zxing/Version.h
# Upstream: https://github.com/zxing-cpp/zxing-cpp

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    # upstream PDF417 decoder uses dynamic_cast (the ESP32 framework disables RTTI)
    -frtti
    -D LED_FLASH=4
    -D LED_BUILTIN=33
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue