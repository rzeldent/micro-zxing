; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file, time, default, extra, esp32_exception_decoder

; ZXing-C++ (https://github.com/zxing-cpp/zxing-cpp) is pulled in as a git submodule in lib/zxing.
; The actual sources live in lib/zxing/core/src and are compiled by the project library
; "zxing_cpp" (lib/zxing_platformio, see its library.json), which also provides the generated
; Version.h that zxing-cpp expects (readers-only config, upstream defaults).
; Notes:
;  - The submodule folder itself has no PlatformIO manifest, so ignore it (lib_ignore) and
;    declare the wrapper explicitly (lib_deps) with LDF disabled instead of relying on header
;    detection (the sources live outside the wrapper's own folder).
;  - Current zxing-cpp requires C++20, which the stock ESP32 Arduino toolchain (gcc 8.4) does
;    not support, so a newer xtensa gcc (12.2) is selected explicitly.
lib_ignore = zxing
lib_ldf_mode = off
lib_deps =
    zxing_cpp
    zxing_patches
platform_packages =
    espressif/toolchain-xtensa-esp32@^12.2.0
build_unflags =
    -std=gnu++11
build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -std=gnu++20
    -O2
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -D LED_FLASH=4
    -D LED_BUILTIN=33
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue