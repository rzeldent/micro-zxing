; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
# Pin the platform for reproducibility; zxing-cpp >= 3.0 needs C++20, so override
# the default GCC 8.4 toolchain with GCC 12.2 (espressif/toolchain-xtensa-esp32).
platform = espressif32@7.0.1
platform_packages =
    espressif/toolchain-xtensa-esp32 @ 12.2.0+20230208
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file, time, default

# Copy the Version.h shim into the build and apply small source patches before
# compiling (see tools/gen_zxing_version.py and tools/patch_zxing_core.py)
extra_scripts =
    pre:tools/gen_zxing_version.py
    pre:tools/patch_zxing_core.py

# zxing-cpp is a git submodule at lib/zxing/src (full upstream repo, pinned to a tag).
# lib/zxing is a thin PlatformIO wrapper that compiles the submodule's core/src.
# To update the library:
#   cd lib/zxing/src && git fetch --tags && git checkout <new-tag> && cd ../..
#   git add lib/zxing/src && git commit
#   then bump the version in lib/zxing/library.json and lib/zxing/Version.h
# Upstream: https://github.com/zxing-cpp/zxing-cpp

build_unflags =
    -std=gnu++11
build_flags =
    # zxing-cpp >= 3.0 core is C++20 (requires the GCC 12 toolchain above)
    -std=gnu++20
    -O2
    -D LED_FLASH=4
    -D LED_BUILTIN=33
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue